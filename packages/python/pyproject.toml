[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbyok"
version = "1.1.0"
description = "Zero-dependency Python BYOK AI toolkit with POSIX 0600 multi-provider vaults, cross-provider failover, and budget guards."
readme = "README.md"
authors = [{ name = "Raele24" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["openbyok", "byok", "ai", "llm", "vault", "gemini", "openai", "claude", "ollama", "failover"]
